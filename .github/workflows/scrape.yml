name: "Scrape Portal Data"

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install selenium webdriver-manager requests urllib3

      - name: Install Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Run scraper
        env:
          JUIT_USERNAME: ${{ secrets.JUIT_USERNAME }}
          JUIT_PASSWORD: ${{ secrets.JUIT_PASSWORD }}
          GH_TOKEN:      ${{ secrets.GH_PAT }}
          GH_REPO:       ${{ github.repository }}
        run: python scripts/scrape.py

      - name: Commit scraped data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add juit_data/
          git commit -m "data: refresh $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]" || echo "Nothing new"
          git push
